<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLUX Playground</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0da; --accent: #3b5bdb; --accent-ink: #ffffff; --err: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d21; --ink: #ececef; --muted: #9a9aa3;
      --line: #2e2e34; --accent: #748ffc; --accent-ink: #0d0d10; --err: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px;
    display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
  textarea, select, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button { margin-top: 18px; width: 100%; padding: 10px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  .stage { min-height: 420px; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; }
  .stage img { max-width: 100%; border-radius: 8px; }
  .meta { font-size: 13px; color: var(--muted); }
  .error { color: var(--err); white-space: pre-wrap; font-size: 13px; }
  .history { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 16px; }
  .history img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); }
  .hidden { display: none; }
  label.check { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0;
    font-size: 14px; color: var(--ink); font-weight: 500; }
  label.check input { width: auto; margin: 0; }
  .stage img, .history img { background: repeating-conic-gradient(#8884 0 25%, #0000 0 50%) 0 0 / 16px 16px; }
  a.dl { color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>FLUX Playground</h1>
    <p class="sub" id="sub">Workers AI · FLUX.2 [klein] 4B</p>
    <p class="sub"><a class="dl" href="/api" target="_blank" rel="noopener">API reference (JSON)</a></p>
    <form id="f" class="panel">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" maxlength="2048" required
        placeholder="treasure chest overflowing with gold coins"></textarea>

      <div class="row">
        <div>
          <label for="scenario">Scenario</label>
          <select id="scenario"></select>
        </div>
        <div>
          <label for="style">Style</label>
          <select id="style"></select>
        </div>
      </div>
      <p id="scenarioHint" class="hint"></p>

      <div class="row">
        <div>
          <label for="size">Size</label>
          <select id="size">
            <option value="1024x1024">1024 × 1024 (square)</option>
            <option value="768x768">768 × 768</option>
            <option value="512x512">512 × 512</option>
            <option value="1216x832">1216 × 832 (landscape)</option>
            <option value="832x1216">832 × 1216 (portrait)</option>
            <option value="1536x864">1536 × 864 (16:9)</option>
            <option value="864x1536">864 × 1536 (9:16)</option>
          </select>
        </div>
        <div>
          <label for="seed">Seed</label>
          <input id="seed" name="seed" type="number" min="0" placeholder="random">
        </div>
      </div>

      <label class="check"><input id="transparent" type="checkbox"> Transparent background (PNG)</label>
      <p class="hint">Removes the background after generation. No need to mention it in the prompt.</p>

      <div id="refBox">
        <label for="ref" id="refLabel">Reference image (optional)</label>
        <input id="ref" type="file" accept="image/*">
        <p class="hint">Downscaled to under 512 px before upload. Refer to it as “image 0” in the prompt.</p>
      </div>

      <div id="keyBox">
        <label for="key">Access key</label>
        <input id="key" type="password" placeholder="the ACCESS_KEY secret">
      </div>

      <button id="go" type="submit">Generate</button>
    </form>
  </section>

  <section class="panel">
    <div id="stage" class="stage"><p class="meta">Your image appears here.</p></div>
    <div id="history" class="history"></div>
  </section>
</main>

<script>
(function () {
  var api = null;
  var $ = function (id) { return document.getElementById(id); };

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var savedKey = recall("flux-key");
  if (savedKey) $("key").value = savedKey;

  function options(list) {
    return list.map(function (x) { return '<option value="' + x.key + '">' + x.label + "</option>"; }).join("");
  }

  function scenario() {
    return api && api.scenarios.find(function (x) { return x.key === $("scenario").value; });
  }

  // Apply the scenario's defaults to the controls; the user can still change them afterwards.
  function syncScenario() {
    var sc = scenario();
    if (!sc) return;
    var size = sc.defaults.width + "x" + sc.defaults.height;
    if ([].some.call($("size").options, function (o) { return o.value === size; })) $("size").value = size;
    $("transparent").checked = sc.defaults.transparent;
    $("scenarioHint").textContent = sc.description + " ~" + sc.estimated_neurons + " neurons.";
    $("refLabel").textContent = sc.requires_ref ? "Reference image (required)" : "Reference image (optional)";
    store("flux-scenario", sc.key);
  }

  fetch("/api").then(function (r) { return r.json(); }).then(function (d) {
    api = d;
    $("sub").textContent = "Workers AI · " + d.model.label;
    $("scenario").innerHTML = options(d.scenarios);
    $("style").innerHTML = options(d.styles);
    var sc = recall("flux-scenario"), st = recall("flux-style");
    if (sc && d.scenarios.some(function (x) { return x.key === sc; })) $("scenario").value = sc;
    if (st && d.styles.some(function (x) { return x.key === st; })) $("style").value = st;
    syncScenario();
  });
  $("scenario").addEventListener("change", syncScenario);
  $("style").addEventListener("change", function () { store("flux-style", $("style").value); });

  // Downscale a user image so its longest side is under 512 px, return a PNG blob.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 496 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error("Could not read image")); }, "image/png");
        URL.revokeObjectURL(img.src);
      };
      img.onerror = function () { reject(new Error("Could not read image")); };
      img.src = URL.createObjectURL(file);
    });
  }

  function show(src, info) {
    $("stage").innerHTML = "";
    var img = document.createElement("img");
    img.src = src;
    var meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent = info;
    var a = document.createElement("a");
    a.className = "dl"; a.href = src; a.download = "flux-" + Date.now() + (src.indexOf("image/png") > -1 ? ".png" : ".jpg");
    a.textContent = "Download";
    $("stage").append(img, meta, a);
  }

  $("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var body = new FormData();
    var wh = $("size").value.split("x");
    body.append("prompt", $("prompt").value);
    body.append("scenario", $("scenario").value);
    body.append("style", $("style").value);
    body.append("width", wh[0]); body.append("height", wh[1]);
    body.append("transparent", $("transparent").checked ? "1" : "0");
    if ($("seed").value !== "") body.append("seed", $("seed").value);

    $("go").disabled = true; $("go").textContent = "Generating…";
    $("stage").innerHTML = '<p class="meta">Working…</p>';
    try {
      if ($("ref").files[0]) body.append("ref", await shrink($("ref").files[0]), "ref.png");
      var key = $("key").value.trim();
      store("flux-key", key);
      var res = await fetch("/generate", { method: "POST", body: body, headers: key ? { "x-access-key": key } : {} });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      var src = "data:" + data.mime + ";base64," + data.image;
      var info = data.scenario + (data.style !== "none" ? " / " + data.style : "") + " · " + (data.ms / 1000).toFixed(1) + " s" + (data.transparent ? " · transparent" : "") +
        (data.estimated_neurons ? " · ~" + data.estimated_neurons + " neurons" : "");
      if (data.warning) info += " · " + data.warning;
      show(src, info);
      var thumb = document.createElement("img");
      thumb.src = src; thumb.title = $("prompt").value;
      thumb.addEventListener("click", function () { show(src, info); });
      $("history").prepend(thumb);
    } catch (err) {
      $("stage").innerHTML = "";
      var p = document.createElement("p");
      p.className = "error"; p.textContent = err.message;
      $("stage").append(p);
    } finally {
      $("go").disabled = false; $("go").textContent = "Generate";
    }
  });
})();
</script>
</body>
</html>
